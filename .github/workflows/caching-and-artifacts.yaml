name: Caching and Artifacts
on: [ workflow_dispatch ]
jobs:
  use-axios:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Cache node modules
      id: cache-dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }} # linux-npm-cache-754665464
        restore-keys: | #restore-keys are useful to find old caches if the above cache is not found
          ${{ runner.os }}-npm-cache-
          ${{ runner.os }}-
    - name: Display Cache Output
      run: echo '${{ toJSON(steps.cache-dependencies.outputs)}}'
    - name: install dependencies
      run: npm install
    - name: Use Axios
      uses: actions/github-script@v6
      with:
        script: |
          const axios = require('axios')
          const res = await axios('https://icanhazdadjoke.com/', { headers: {
          Accept: 'text/plain'}})
          console.log(res.data)
