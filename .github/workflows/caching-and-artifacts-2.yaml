name: Caching and Artifacts-2
on: [ workflow_dispatch ]
jobs:
  use-axios:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Cache node modules
      id: cache-dependencies
      uses: actions/cache@v3
      with:
        path: ~/.npm
        key: ${{ runner.os }}-npm-cache-${{ hashFiles('**/package-lock.json') }} # linux-npm-cache-754665464
        restore-keys: | #restore-keys are useful to find old caches if the above cache is not found
          ${{ runner.os }}-npm-cache-
          ${{ runner.os }}-
    - name: Display Cache Output
      run: echo '${{ toJSON(steps.cache-dependencies.outputs)}}'
    - name: Install dependencies
      run: npm install
    - name: Run tests
      run: npm test
    - name: Upload Code Coverage Report
      uses: actions/upload-artifact@v6
      if: always()
      with:
        name: code-coverage
        path: coverage
        retention-days: 10
    - name: Download Code Coverage
      uses: actions/download-artifact@v6
      with:
        name: code-coverage
        path: code-coverage-report
    - run: ls -a
    - run: ls -a
      working-directory: code-coverage-report
    - name: Use Axios
      uses: actions/github-script@v6
      with:
        script: |
          const axios = require('axios')
          const res = await axios('https://icanhazdadjoke.com/', { headers: {
          Accept: 'text/plain'}})
          console.log(res.data)
